[general]
master_seed = 41
description = Rapid Impact Assessment ERMCH 23

[hazard_source]
source_type = custom_csv
gmf_cols = psa03_%g, psa06_%g
uncertainty_cols = lnpsa03_uncertainty, lnpsa06_uncertainty
files = psa03_m51.csv, psa06_m51.csv

[hazard]
random_seed  = 41
asset_hazard_distance = 1000000
truncation_level = 2.0
intensity_measure_types = SA(0.3), SA(0.6)
number_of_ground_motion_fields = 5
minimum_intensity = {"SA(0.3)": 0.02, "SA(0.6)": 0}
