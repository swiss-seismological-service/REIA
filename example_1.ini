[general]
master_seed = 567
description = Rapid Impact Assessment ERMCH 23
aggregate_by = Canton; CantonGemeinde

[hazard_source]
source_type = custom_csv
gmf_cols = psa03_%g, psa06_%g
uncertainty_cols = lnpsa03_uncertainty, lnpsa06_uncertainty
files = psa03_withampli.csv, psa06_withampli.csv

[hazard]
random_seed  = 568
asset_hazard_distance = 2
truncation_level = 2.0
intensity_measure_types = SA(0.3), SA(0.6)
number_of_ground_motion_fields = 500
minimum_intensity = {"SA(0.3)": 0.10, "SA(0.6)": 0.05}

[risk_calculation]
time_event = day

[exposure]
exposure_file = 1

[fragility]
structural_fragility_file = 1
taxonomy_mapping_csv = 1

[vulnerability]
structural_vulnerability_file = 1
contents_vulnerability_file = 2
occupants_vulnerability_file = 3
nonstructural_vulnerability_file = 4
business_interruption_vulnerability_file = 5

[calculation]
minimum_asset_loss = {'structural': 2000, 'contents': 1000, 'occupants': 0, 'nonstructural': 0, 'business_interruption': 0}
